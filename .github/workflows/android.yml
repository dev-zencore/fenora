name: Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm ci
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK with embedded JavaScript bundle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign APK with temporary CI debug key
        working-directory: android
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/finora-ci.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/finora-ci.keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$GITHUB_WORKSPACE/finora-release.apk" "$APK"
      - name: Package source
        run: zip -r finora-source.zip . -x 'node_modules/*' '.git/*' 'android/.gradle/*'
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            finora-source.zip
            finora-release.apk
